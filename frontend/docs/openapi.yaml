openapi: 3.1.0
info:
  title: Academic Advising Portal API
  version: 1.2.0
  description: >
    What the React frontend (Figma v1.2) sends and expects from the FastAPI backend (COS40005).
    Rules and examples are in API_CONTRACT.md. Requests never contain a name or student ID.
servers:
  - url: http://localhost:8000
paths:
  /api/majors:
    get:
      summary: Computer Science majors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [majors]
                properties:
                  majors: { type: array, items: { $ref: '#/components/schemas/Major' } }
        default: { $ref: '#/components/responses/Error' }
  /api/units:
    get:
      summary: Seeded units (search, Edit my units, roadmap names)
      parameters:
        - { name: major, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [units]
                properties:
                  units: { type: array, items: { $ref: '#/components/schemas/Unit' } }
        default: { $ref: '#/components/responses/Error' }
  /api/recommend:
    post:
      summary: Semester plan for a profile (Plan semester)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        default: { $ref: '#/components/responses/Error' }
  /api/chat:
    post:
      summary: Answer from the approved unit outlines (Ask the assistant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 500 }
                history:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                scope: { type: array, items: { type: string, enum: [outlines, plan, grades] } }
                plan:
                  description: Sent only when the "My plan" chip is on.
                  allOf:
                    - { $ref: '#/components/schemas/PlanRequest' }
                    - type: object
                      properties:
                        start_term: { type: string, examples: ['January 2027'] }
                        grades:
                          description: Sent only when the "Past grades" chip is on.
                          type: object
                          additionalProperties: { type: string, enum: [HD, D, C, P] }
      responses:
        '200':
          description: Answered, clarifying question, or abstained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/plans:
    post:
      summary: Share a plan with an advisor by code (not in the backend yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [major, units]
              properties:
                major: { type: string }
                units:
                  type: object
                  additionalProperties:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [passed, failed, enrolled] }
                      grade: { type: string, enum: [HD, D, C, P] }
                start: { type: string, description: 'Term key, year-index: 2027-0 is January 2027' }
                load: { type: integer, minimum: 1, maximum: 4 }
<<<<<<< Updated upstream
                swaps:
                  type: array
                  description: 'Unit pairs the student swapped in the planner, applied in order'
                  items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
=======
>>>>>>> Stashed changes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, examples: ['A7-3K'] }
        default: { $ref: '#/components/responses/Error' }
components:
  schemas:
    Major:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Unit:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z]{3}[0-9]{5}$' }
        name: { type: string }
        credit_points: { type: number }
    PlanRequest:
      type: object
      required: [major, completed_units]
      properties:
        major: { type: string }
        completed_units: { type: array, items: { type: string } }
        failed_units: { type: array, items: { type: string } }
        enrolled_units: { type: array, items: { type: string } }
        units_per_semester: { type: integer, default: 3 }
    Plan:
      type: object
      required: [major, semesters, blocked_units]
      properties:
        major: { $ref: '#/components/schemas/Major' }
        semesters:
          type: array
          items:
            type: object
            required: [index, units]
            properties:
              index: { type: integer }
              name: { type: string }
              credit_points: { type: number }
              units:
                type: array
                items:
                  allOf:
                    - { $ref: '#/components/schemas/Unit' }
                    - type: object
                      properties:
                        rank: { type: integer }
                        is_retake: { type: boolean }
                        reason: { type: string }
        blocked_units:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/Unit' }
              - type: object
                properties:
                  missing_prereqs: { type: array, items: { type: string } }
                  available_after: { type: [string, 'null'] }
        violations: { type: integer }
        completed_units: { type: array, items: { type: string } }
        failed_units: { type: array, items: { type: string } }
        enrolled_units: { type: array, items: { type: string } }
        dag_graph:
          type: object
          properties:
            nodes:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  label: { type: string }
                  status: { type: string, enum: [passed, enrolled, retake, planned, blocked] }
            edges:
              type: array
              items:
                type: object
                required: [source, target]
                properties:
                  source: { type: string }
                  target: { type: string }
                  rule_type: { type: string, enum: [AND, OR, ASSUMED] }
    Citation:
      type: object
      description: v1.2 shape. The backend's current { source_file, text_snippet, similarity_score } is also accepted.
      properties:
        doc: { type: string }
        section: { type: [string, 'null'] }
        page: { type: [integer, 'null'] }
        outline_date: { type: [string, 'null'], examples: ['Jan 2026'] }
        quote: { type: [string, 'null'] }
        url: { type: [string, 'null'] }
        table:
          type: object
          properties:
            head: { type: array, items: { type: string } }
            rows: { type: array, items: { type: array, items: { type: string } } }
            highlight: { type: array, items: { type: integer } }
    ChatResponse:
      type: object
      required: [answer, citations, abstained]
      properties:
        answer: { type: [string, 'null'], description: 'Markdown; [n] refers to citations[n-1]' }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        steps:
          type: array
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              detail: { type: string }
        needs_clarification: { type: boolean }
        options:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
              note: { type: string }
        abstained: { type: boolean }
        abstain_reason: { type: [string, 'null'], enum: [OUT_OF_SCOPE, LOW_SIMILARITY, UNIT_NOT_FOUND, null] }
        top_similarity: { type: number }
        threshold: { type: number }
        sources_checked: { type: integer }
        sources_passed: { type: integer }
        latency_ms: { type: integer }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }
