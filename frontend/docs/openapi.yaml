openapi: 3.1.0
info:
  title: Academic Advising Portal API
  version: 1.1.0
  description: >
    Contract between the React frontend and the FastAPI backend (COS40005).
    Rules and examples are in API_CONTRACT.md. Requests never contain personal data.
servers:
  - url: http://localhost:8000
paths:
  /api/health:
    get:
      summary: Service and engine status (monitoring only, not called by the UI)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }
                  engines:
                    type: object
                    properties:
                      rag: { type: string }
                      dag: { type: string }
  /api/majors:
    get:
      summary: In-scope computing majors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [majors]
                properties:
                  majors: { type: array, items: { $ref: '#/components/schemas/Major' } }
        default: { $ref: '#/components/responses/Error' }
  /api/units:
    get:
      summary: Units for the completed-units checklist
      parameters:
        - name: major
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [units]
                properties:
                  units: { type: array, items: { $ref: '#/components/schemas/Unit' } }
        default: { $ref: '#/components/responses/Error' }
  /api/recommend:
    post:
      summary: Recommended units for a major, grouped into prerequisite-valid semesters (Engine 1, NetworkX DAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [major, completed_units]
              properties:
                major: { type: string, example: artificial-intelligence }
                completed_units:
                  type: array
                  items: { type: string, example: COS10009 }
      responses:
        '200':
          description: Plan generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathwayResponse' }
        '409':
          description: Cycle detected in curriculum data (code CURRICULUM_CYCLE, details.cycle)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/chat:
    post:
      summary: Grounded syllabus answer with citations, or an abstention (Engine 2, RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 500 }
                history:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        '200':
          description: Answered or abstained (abstention is not an error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        default: { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Any failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Major:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: artificial-intelligence }
        name: { type: string, example: Artificial Intelligence }
    Unit:
      type: object
      required: [code, name, credit_points]
      properties:
        code: { type: string, example: COS20007 }
        name: { type: string, example: Object Oriented Programming }
        credit_points: { type: number, example: 12.5 }
    Semester:
      type: object
      required: [index, name, credit_points, units]
      properties:
        index: { type: integer, minimum: 1 }
        name: { type: string, example: Semester 1 }
        credit_points: { type: number }
        units:
          type: array
          description: Sorted by rank, rank 1 first
          items: { $ref: '#/components/schemas/RankedUnit' }
    RankedUnit:
      allOf:
        - $ref: '#/components/schemas/Unit'
        - type: object
          required: [rank, reason]
          properties:
            rank:
              type: integer
              minimum: 1
              description: Position in the semester. A unit that unlocks more later units ranks higher (len(nx.descendants(G.subgraph(remaining), unit)))
            reason: { type: string, example: unlocks 5 later units }
    BlockedUnit:
      allOf:
        - $ref: '#/components/schemas/Unit'
        - type: object
          required: [missing_prereqs, available_after]
          properties:
            missing_prereqs: { type: array, items: { type: string } }
            available_after:
              type: [string, 'null']
              example: Semester 2
              description: Semester of the last missing prerequisite. null if any missing prerequisite is not planned, or if missing_prereqs is empty
    PathwayResponse:
      type: object
      required: [major, semesters, blocked_units, violations, completed_units]
      properties:
        major: { $ref: '#/components/schemas/Major' }
        semesters: { type: array, items: { $ref: '#/components/schemas/Semester' } }
        blocked_units: { type: array, items: { $ref: '#/components/schemas/BlockedUnit' } }
        violations: { type: integer, minimum: 0, description: 'Must be 0 (target: 0.0% violation rate)' }
        completed_units: { type: array, items: { type: string } }
    Citation:
      type: object
      required: [id, doc, section, page, snippet, similarity]
      properties:
        id: { type: string, description: Chunk id in the vector store, example: chunk_0142 }
        doc: { type: string, example: COS30019 Unit Outline }
        section: { type: string, example: §4 Assessment }
        page: { type: [integer, 'null'], example: 6 }
        snippet: { type: string }
        similarity: { type: number, minimum: 0, maximum: 1 }
        url: { type: [string, 'null'], description: Full source document; null hides the link }
    ChatResponse:
      type: object
      required:
        [
          answer,
          citations,
          abstained,
          abstain_reason,
          top_similarity,
          threshold,
          sources_checked,
          sources_passed,
          latency_ms,
        ]
      properties:
        answer: { type: [string, 'null'], description: null when abstained }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' }, description: Empty when abstained }
        abstained: { type: boolean }
        abstain_reason: { type: [string, 'null'], enum: [LOW_SIMILARITY, OUT_OF_SCOPE, null] }
        top_similarity: { type: number }
        threshold: { type: number, example: 0.7 }
        sources_checked: { type: integer }
        sources_passed: { type: integer }
        latency_ms: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  UNKNOWN_MAJOR,
                  UNKNOWN_UNIT,
                  VALIDATION_ERROR,
                  CURRICULUM_CYCLE,
                  NOT_FOUND,
                  METHOD_NOT_ALLOWED,
                  SERVICE_UNAVAILABLE,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            details: { type: object }
