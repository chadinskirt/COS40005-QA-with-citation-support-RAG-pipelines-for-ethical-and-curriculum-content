services:
  postgres:
    image: postgres:16-alpine
    container_name: advising-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academic_advising
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academic_advising"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: advising-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/academic_advising
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./doc:/app/doc
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: advising-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_USE_MOCK: "false"
      VITE_API_BASE_URL: /api
      BACKEND_URL: http://backend:8000
      VITE_ADVISOR_URL: mailto:advisor@example.edu
    depends_on:
      - backend

volumes:
  pgdata:
